name: Build mod

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build shadow jar (Fabric mod)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build shadow jar
        run: ./gradlew --no-daemon shadowJar

      - name: Inspect jar contents
        run: |
          set -e
          jar="$(find build/libs -name 'ts-generator-*-all.jar' -print -quit)"
          echo "jar=$jar"
          [ -n "$jar" ] || { echo "no shadow jar produced" >&2; exit 1; }
          echo "--- fabric.mod.json in jar ---"
          unzip -p "$jar" fabric.mod.json
          echo "--- key classes ---"
          unzip -l "$jar" | grep -E 'ScriptHelper|NPMPackageGenerator|TypeScriptGenerator' | head

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ts-generator-mod
          path: build/libs/ts-generator-*-all.jar
          if-no-files-found: error
          retention-days: 30
