group 'com.github.commandblock2'
version '1.1.4'

buildscript {
    ext.kotlin_version = '2.0.0'


    repositories {
        mavenLocal()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "com.gradleup.shadow:shadow-gradle-plugin:8.3.5"
    }
}


apply plugin: 'kotlin'
apply plugin: 'com.gradleup.shadow'

tasks.register('sourcesJar', Jar) {
    dependsOn classes
    archiveClassifier.set('sources')
    from sourceSets.main.allSource
}

artifacts {
    archives sourcesJar
}

repositories {
    mavenCentral()
}

test {
    jvmArgs '-Dkotest.assertions.collection.print.size=1024'
    useJUnitPlatform()
}


dependencies {
    // compileOnly (NOT implementation): kotlin-stdlib + kotlin-reflect are provided
    // at runtime by LiquidBounce's fabric-language-kotlin (currently Kotlin 2.3.10).
    // Bundling our own (older) copy into the shadow jar makes Knot load TWO Kotlin
    // runtimes: LB's code is compiled against 2.3.x and references newer reflect API
    // (e.g. `KParameter.Kind.CONTEXT`, added in Kotlin 2.2) that the bundled 2.0.0
    // `KParameter$Kind` lacks → `NoSuchFieldError` the instant ts-defgen reflects.
    // We compile against 2.0.0 (the build's compiler) but ship none of it; LB's
    // newer-but-backward-compatible Kotlin runs it. Same pattern as Guava/Gson below.
    // (kotlin.stdlib.default.dependency=false in gradle.properties stops the Kotlin
    //  plugin from re-adding stdlib as a bundled implementation dep.)
    compileOnly "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    compileOnly "org.jetbrains.kotlin:kotlin-reflect:$kotlin_version"
    // Tests run outside LB (plain JVM) — they need Kotlin on the test classpath.
    testImplementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    testImplementation "org.jetbrains.kotlin:kotlin-reflect:$kotlin_version"

    // compileOnly: Guava is provided at runtime by LiquidBounce / Minecraft
    // (we run inside the Knot classloader as a Fabric mod), so we don't want
    // to bundle it into the shadow jar.
    compileOnly 'com.google.guava:guava:33.4.0-jre'

    // compileOnly: Gson is provided at runtime by Minecraft / LiquidBounce
    // (bundled in the game jar). Must NOT be implementation — the shadow jar
    // must not double-bundle Gson, same pattern as the Guava entry above.
    compileOnly 'com.google.code.gson:gson:2.10.1'

    testImplementation 'io.kotest:kotest-runner-junit5:5.7.2'
    // Gson is compileOnly for production (provided by LB runtime), but tests
    // run outside LB so we need it on the test classpath explicitly.
    testImplementation 'com.google.code.gson:gson:2.10.1'
}

shadowJar {
    archiveClassifier.set('all')
    mergeServiceFiles()
}


